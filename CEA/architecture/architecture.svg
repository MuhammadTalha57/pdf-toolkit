<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-label="PDF Toolkit AWS three-tier architecture">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 14px; fill: #475569; }
      .band-label { font-size: 13px; font-weight: 700; }
      .box-title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .box-body { font-size: 12.5px; fill: #334155; }
      .edge-label { font-size: 12px; fill: #334155; stroke: #ffffff; stroke-width: 4px; paint-order: stroke; }
      .sg-label { font-size: 11px; font-weight: 600; }
      .legend { font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <rect width="1500" height="1000" fill="#ffffff"/>

  <text x="60" y="52" class="title">PDF Toolkit — AWS Three-Tier Architecture</text>
  <text x="60" y="80" class="subtitle">CEA · Terraform-provisioned · default region us-east-1 · only the ALB is Internet-facing</text>

  <!-- Internet -->
  <ellipse cx="180" cy="150" rx="105" ry="46" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="180" y="146" text-anchor="middle" class="box-title">Internet</text>
  <text x="180" y="166" text-anchor="middle" class="box-body">Browser / user</text>

  <!-- VPC -->
  <rect x="60" y="200" width="1020" height="750" rx="16" fill="#ffffff" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="82" y="228" class="band-label" fill="#334155">VPC 10.0.0.0/16 · 2 Availability Zones</text>

  <!-- Public subnets -->
  <rect x="85" y="245" width="970" height="145" rx="12" fill="#e8f1fb" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="102" y="268" class="band-label" fill="#1d4ed8">Public subnets · 2 AZs</text>

  <rect x="200" y="285" width="300" height="82" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="350" y="312" text-anchor="middle" class="box-title">Application Load Balancer</text>
  <text x="350" y="333" text-anchor="middle" class="box-body">Internet-facing · HTTP :80</text>
  <text x="350" y="351" text-anchor="middle" class="box-body">optional HTTPS :443 with ACM</text>

  <rect x="700" y="290" width="240" height="72" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="820" y="317" text-anchor="middle" class="box-title">NAT Gateway</text>
  <text x="820" y="338" text-anchor="middle" class="box-body">single · cost trade-off</text>
  <text x="820" y="354" text-anchor="middle" class="box-body">+ Elastic IP</text>

  <!-- Private app subnets -->
  <rect x="85" y="425" width="970" height="235" rx="12" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
  <text x="102" y="448" class="band-label" fill="#15803d">Private app subnets · 2 AZs · no public IPs</text>

  <rect x="200" y="470" width="300" height="145" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="350" y="498" text-anchor="middle" class="box-title">ECS Fargate — Web</text>
  <text x="350" y="520" text-anchor="middle" class="box-body">Next.js standalone · :3000</text>
  <text x="350" y="540" text-anchor="middle" class="box-body">0.5 vCPU / 1024 MiB</text>
  <text x="350" y="560" text-anchor="middle" class="box-body">desired 2 · min 2 · max 4</text>
  <text x="350" y="580" text-anchor="middle" class="box-body">Service Connect client</text>

  <rect x="650" y="470" width="300" height="145" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="800" y="498" text-anchor="middle" class="box-title">ECS Fargate — API</text>
  <text x="800" y="520" text-anchor="middle" class="box-body">Express · :3000</text>
  <text x="800" y="540" text-anchor="middle" class="box-body">0.25 vCPU / 512 MiB</text>
  <text x="800" y="560" text-anchor="middle" class="box-body">desired 2 · min 2 · max 4</text>
  <text x="800" y="580" text-anchor="middle" class="box-body">Service Connect server: api</text>

  <!-- Private DB subnets -->
  <rect x="85" y="690" width="970" height="150" rx="12" fill="#fff4e6" stroke="#ea580c" stroke-width="1.5"/>
  <text x="102" y="713" class="band-label" fill="#c2410c">Private DB subnets · 2 AZs · no Internet route</text>

  <rect x="650" y="730" width="300" height="90" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="800" y="757" text-anchor="middle" class="box-title">RDS PostgreSQL 16</text>
  <text x="800" y="778" text-anchor="middle" class="box-body">db.t4g.micro · 20 GiB gp3</text>
  <text x="800" y="798" text-anchor="middle" class="box-body">Single-AZ default · Multi-AZ variable</text>
  <text x="800" y="814" text-anchor="middle" class="box-body">encrypted · rds.force_ssl=1</text>

  <!-- Security group labels -->
  <text x="500" y="281" text-anchor="end" class="sg-label" fill="#1d4ed8">SG: 80/443 from allowed CIDRs</text>
  <text x="350" y="600" text-anchor="middle" class="sg-label" fill="#15803d">SG: 3000 from ALB SG</text>
  <text x="800" y="600" text-anchor="middle" class="sg-label" fill="#15803d">SG: 3000 from web SG</text>
  <text x="650" y="726" class="sg-label" fill="#c2410c">SG: 5432 only from API SG</text>

  <!-- Managed services panel -->
  <rect x="1110" y="245" width="330" height="595" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1128" y="272" class="band-label" fill="#334155">AWS managed services</text>

  <rect x="1130" y="290" width="290" height="92" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="1275" y="316" text-anchor="middle" class="box-title">S3 bucket (private)</text>
  <text x="1275" y="338" text-anchor="middle" class="box-body">tmp/ expires after 1 day</text>
  <text x="1275" y="356" text-anchor="middle" class="box-body">users/{id}/results retained</text>
  <text x="1275" y="374" text-anchor="middle" class="box-body">versioned · SSE · TLS-only policy</text>

  <rect x="1130" y="400" width="290" height="78" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="1275" y="426" text-anchor="middle" class="box-title">ECR</text>
  <text x="1275" y="448" text-anchor="middle" class="box-body">api + web · scan on push</text>
  <text x="1275" y="466" text-anchor="middle" class="box-body">keep last 10 images</text>

  <rect x="1130" y="496" width="290" height="78" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="1275" y="522" text-anchor="middle" class="box-title">SSM Parameter Store</text>
  <text x="1275" y="544" text-anchor="middle" class="box-body">DATABASE_URL · JWT_SECRET</text>
  <text x="1275" y="562" text-anchor="middle" class="box-body">SecureString · default KMS key</text>

  <rect x="1130" y="592" width="290" height="78" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="1275" y="618" text-anchor="middle" class="box-title">CloudWatch</text>
  <text x="1275" y="640" text-anchor="middle" class="box-body">ECS logs · metrics · alarms</text>
  <text x="1275" y="658" text-anchor="middle" class="box-body">7-day retention</text>

  <rect x="1130" y="688" width="290" height="78" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="1275" y="714" text-anchor="middle" class="box-title">GitHub Actions</text>
  <text x="1275" y="736" text-anchor="middle" class="box-body">OIDC deploy role · no static keys</text>
  <text x="1275" y="754" text-anchor="middle" class="box-body">test → build → push → deploy</text>

  <!-- Request paths -->
  <path d="M 250 194 L 300 285" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <path d="M 350 367 L 350 470" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="362" y="422" class="edge-label">forward :3000</text>

  <path d="M 500 542 L 650 542" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="512" y="530" class="edge-label">Service Connect</text>
  <text x="512" y="560" class="edge-label">http://api:3000</text>

  <path d="M 800 615 L 800 730" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="812" y="678" class="edge-label">5432 · sslmode=require</text>

  <!-- Management/data paths -->
  <path d="M 950 505 C 1010 505, 1070 380, 1130 340" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="985" y="410" class="edge-label">S3 HTTPS</text>

  <path d="M 950 540 L 1130 532" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="975" y="525" class="edge-label">secrets at task start</text>

  <path d="M 950 572 L 1130 628" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="980" y="612" class="edge-label">logs</text>

  <path d="M 1130 439 L 950 490" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="975" y="462" class="edge-label">image pull via NAT</text>

  <path d="M 1275 688 L 1275 478" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="1286" y="590" class="edge-label">push images</text>

  <path d="M 1130 727 C 1070 727, 1010 640, 950 600" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="992" y="694" class="edge-label">force ECS deployment</text>

  <path d="M 820 362 L 820 425" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="832" y="398" class="edge-label">outbound via NAT</text>

  <!-- Legend -->
  <rect x="60" y="965" width="18" height="14" rx="3" fill="#e8f1fb" stroke="#3b82f6"/>
  <text x="86" y="977" class="legend">public</text>
  <rect x="150" y="965" width="18" height="14" rx="3" fill="#e9f7ef" stroke="#16a34a"/>
  <text x="176" y="977" class="legend">private app</text>
  <rect x="262" y="965" width="18" height="14" rx="3" fill="#fff4e6" stroke="#ea580c"/>
  <text x="288" y="977" class="legend">private DB</text>
  <rect x="372" y="965" width="18" height="14" rx="3" fill="#f8fafc" stroke="#64748b"/>
  <text x="398" y="977" class="legend">AWS managed</text>
  <line x1="520" y1="972" x2="560" y2="972" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="568" y="977" class="legend">request path</text>
  <line x1="680" y1="972" x2="720" y2="972" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="728" y="977" class="legend">management / data</text>
</svg>
