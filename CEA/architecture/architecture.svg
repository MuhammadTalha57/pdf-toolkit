<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" width="1300" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .t  { font-size: 13px; fill: #111827; }
      .ts { font-size: 11px; fill: #374151; }
      .tl { font-size: 11px; fill: #6b7280; }
      .b  { font-weight: 600; }
      .h  { font-size: 15px; font-weight: 700; fill: #111827; }
      .req { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#a); }
      .ctl { stroke: #6b7280; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#g); }
      .sg  { fill: #ffffff; stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .box { fill: #ffffff; stroke: #374151; stroke-width: 1.2; }
      .svc { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1300" height="900" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#111827">PDF Toolkit — three-tier deployment on AWS</text>
  <text x="30" y="64" class="ts">ECS Fargate · ALB · RDS PostgreSQL · S3 · ECR · Terraform · GitHub Actions (OIDC)</text>

  <!-- Users -->
  <rect x="30" y="180" width="140" height="50" rx="8" class="box"/>
  <text x="100" y="202" text-anchor="middle" class="t b">Users</text>
  <text x="100" y="219" text-anchor="middle" class="ts">web browser</text>

  <!-- GitHub -->
  <rect x="1010" y="20" width="270" height="88" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="1.2"/>
  <text x="1145" y="42" text-anchor="middle" class="t b">GitHub Actions (ci-cd.yml)</text>
  <text x="1145" y="61" text-anchor="middle" class="ts">every PR / push: install → type-check →</text>
  <text x="1145" y="76" text-anchor="middle" class="ts">tests → build → terraform validate</text>
  <text x="1145" y="93" text-anchor="middle" class="ts">push to main: build images → ECR → ECS</text>

  <!-- AWS cloud -->
  <rect x="200" y="130" width="1090" height="750" rx="10" fill="#fafafa" stroke="#f59e0b" stroke-width="2"/>
  <text x="215" y="152" class="h" fill="#b45309">AWS Cloud · us-east-1</text>

  <!-- VPC -->
  <rect x="225" y="170" width="760" height="690" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="845" y="192" class="t b" fill="#6d28d9">VPC 10.0.0.0/16</text>

  <!-- IGW -->
  <rect x="240" y="185" width="110" height="40" rx="6" class="box"/>
  <text x="295" y="210" text-anchor="middle" class="ts b">Internet gateway</text>

  <!-- Public band -->
  <rect x="245" y="240" width="720" height="170" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <line x1="605" y1="240" x2="605" y2="410" stroke="#059669" stroke-dasharray="4 4"/>
  <text x="255" y="258" class="tl">Public subnet · AZ a · 10.0.0.0/24</text>
  <text x="615" y="258" class="tl">Public subnet · AZ b · 10.0.1.0/24</text>
  <text x="955" y="400" text-anchor="end" class="tl">route 0.0.0.0/0 → IGW</text>

  <rect x="390" y="280" width="390" height="78" rx="6" class="sg"/>
  <rect x="400" y="290" width="370" height="55" rx="6" class="svc"/>
  <text x="585" y="312" text-anchor="middle" class="t b">Application Load Balancer (internet-facing)</text>
  <text x="585" y="330" text-anchor="middle" class="ts">listener :80 → target group "web" (IP, health check /)</text>
  <text x="600" y="374" class="ts" fill="#dc2626">sg-alb · in: 80 from internet</text><text x="600" y="389" class="ts" fill="#dc2626">out: 3000 to sg-web only</text>

  <rect x="262" y="300" width="118" height="50" rx="6" class="box"/>
  <text x="321" y="321" text-anchor="middle" class="ts b">NAT gateway</text>
  <text x="321" y="337" text-anchor="middle" class="ts">+ Elastic IP</text>

  <!-- Private band -->
  <rect x="245" y="440" width="720" height="400" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="605" y1="440" x2="605" y2="840" stroke="#2563eb" stroke-dasharray="4 4"/>
  <text x="255" y="458" class="tl">Private subnet · AZ a · 10.0.10.0/24</text>
  <text x="615" y="458" class="tl">Private subnet · AZ b · 10.0.11.0/24</text>
  <text x="955" y="832" text-anchor="end" class="tl">route 0.0.0.0/0 → NAT · S3 → gateway endpoint</text>

  <!-- Web tier -->
  <rect x="265" y="476" width="640" height="86" rx="6" class="sg"/>
  <text x="275" y="492" class="ts" fill="#dc2626">sg-web · in: 3000 from sg-alb</text>
  <text x="585" y="514" text-anchor="middle" class="t b">Web tier — ECS Fargate service "web" (Next.js container)</text>
  <text x="585" y="532" text-anchor="middle" class="ts">1–2 tasks across both AZs · CPU target tracking 60 %</text>
  <text x="585" y="549" text-anchor="middle" class="ts">serves the UI and proxies /api/* → http://api:3000</text>

  <!-- App tier -->
  <rect x="265" y="598" width="640" height="86" rx="6" class="sg"/>
  <text x="275" y="614" class="ts" fill="#dc2626">sg-api · in: 3000 from sg-web only</text>
  <text x="585" y="636" text-anchor="middle" class="t b">App tier — ECS Fargate service "api" (Express container)</text>
  <text x="585" y="654" text-anchor="middle" class="ts">1–2 tasks across both AZs · no load balancer, no public IP</text>
  <text x="585" y="671" text-anchor="middle" class="ts">auth (JWT cookie), PDF merge/split/organize, history</text>

  <!-- DB tier -->
  <rect x="265" y="720" width="640" height="86" rx="6" class="sg"/>
  <text x="275" y="736" class="ts" fill="#dc2626">sg-rds · in: 5432 from sg-api only</text>
  <text x="585" y="758" text-anchor="middle" class="t b">Database tier — Amazon RDS for PostgreSQL 16</text>
  <text x="585" y="776" text-anchor="middle" class="ts">db.t4g.micro · 20 GiB gp3 · encrypted · not publicly accessible</text>
  <text x="585" y="793" text-anchor="middle" class="ts">TLS enforced (rds.force_ssl) · Multi-AZ optional</text>

  <!-- S3 endpoint -->
  <rect x="920" y="619" width="110" height="44" rx="6" class="box"/>
  <text x="975" y="637" text-anchor="middle" class="ts b">S3 gateway</text>
  <text x="975" y="652" text-anchor="middle" class="ts">endpoint</text>

  <!-- Regional services -->
  <rect x="1040" y="170" width="230" height="64" rx="6" class="box"/>
  <text x="1155" y="192" text-anchor="middle" class="t b">IAM deploy role (OIDC)</text>
  <text x="1155" y="209" text-anchor="middle" class="ts">main branch only · push to 2 ECR repos</text>
  <text x="1155" y="224" text-anchor="middle" class="ts">· UpdateService on 2 ECS services</text>

  <rect x="1040" y="262" width="230" height="56" rx="6" class="svc"/>
  <text x="1155" y="284" text-anchor="middle" class="t b">Amazon ECR</text>
  <text x="1155" y="302" text-anchor="middle" class="ts">web + api images · latest + SHA · scan</text>

  <rect x="1040" y="346" width="230" height="56" rx="6" class="svc"/>
  <text x="1155" y="368" text-anchor="middle" class="t b">SSM Parameter Store</text>
  <text x="1155" y="386" text-anchor="middle" class="ts">SecureString: DATABASE_URL, JWT_SECRET</text>

  <rect x="1040" y="430" width="230" height="56" rx="6" class="svc"/>
  <text x="1155" y="452" text-anchor="middle" class="t b">CloudWatch Logs</text>
  <text x="1155" y="470" text-anchor="middle" class="ts">/ecs/…/web, /ecs/…/api · 7 days</text>

  <rect x="1040" y="611" width="230" height="60" rx="6" class="svc"/>
  <text x="1155" y="633" text-anchor="middle" class="t b">Amazon S3 bucket</text>
  <text x="1155" y="651" text-anchor="middle" class="ts">private · TLS-only · tmp/ expires in 1 day</text>

  <!-- Request path -->
  <path d="M170,205 L238,205" class="req"/>
  <text x="178" y="198" class="ts">HTTP</text>
  <path d="M350,205 L585,205 L585,288" class="req"/>
  <text x="575" y="275" text-anchor="end" class="ts">:80</text>
  <path d="M585,345 L585,474" class="req"/>
  <text x="575" y="430" text-anchor="end" class="ts b">:3000</text>
  <path d="M585,562 L585,596" class="req"/>
  <text x="575" y="584" text-anchor="end" class="ts b">:3000 via ECS Service Connect</text>
  <path d="M585,684 L585,718" class="req"/>
  <text x="575" y="706" text-anchor="end" class="ts b">:5432 TLS (verify-full)</text>
  <path d="M905,641 L918,641" class="req"/>
  <path d="M1030,641 L1038,641" class="req"/>

  <!-- Outbound via NAT -->
  <path d="M321,300 L321,227" class="ctl"/>
  <text x="327" y="292" class="tl">outbound</text>
  <path d="M290,476 L290,352" class="ctl"/>
  <text x="298" y="425" class="tl">tasks → NAT (ECR, SSM, logs)</text>

  <!-- Control plane -->
  <path d="M1145,108 L1145,168" class="ctl"/>
  <text x="1138" y="143" text-anchor="end" class="tl">OIDC (short-lived token)</text>
  <path d="M1155,234 L1155,260" class="ctl"/>
  <path d="M1040,296 L907,500" class="ctl"/>
  <text x="903" y="448" class="tl" transform="rotate(-57 903 448)">image pull</text>
  <path d="M1040,380 L907,620" class="ctl"/>
  <text x="903" y="575" class="tl" transform="rotate(-61 903 575)">secrets at start</text>

  <!-- Legend -->
  <text x="30" y="300" class="t b">Legend</text>
  <path d="M30,322 L90,322" class="req"/>
  <text x="98" y="326" class="ts">request path</text>
  <path d="M30,346 L90,346" class="ctl"/>
  <text x="98" y="350" class="ts">control / outbound</text>
  <rect x="30" y="362" width="60" height="22" class="sg"/>
  <text x="98" y="377" class="ts">security group</text>
  <rect x="30" y="394" width="60" height="22" rx="4" class="svc"/>
  <text x="98" y="409" class="ts">AWS service</text>

  <text x="30" y="460" class="t b">Scaling</text>
  <text x="30" y="480" class="ts">ECS Service Auto Scaling</text>
  <text x="30" y="496" class="ts">per service, 1 → 2 tasks</text>
  <text x="30" y="512" class="ts">target: 60 % average CPU</text>

  <text x="30" y="556" class="t b">Infrastructure</text>
  <text x="30" y="576" class="ts">Terraform (infra/terraform)</text>
  <text x="30" y="592" class="ts">64 resources, one apply</text>
</svg>
