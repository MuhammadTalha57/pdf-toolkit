name: CI/CD

# Pull requests: build + test only.
# Push to main: build + test, then build both images, push them to ECR and
# roll the ECS services onto the new images.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a deployment on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: pdf-toolkit-prod
  WEB_SERVICE: pdf-toolkit-prod-web
  API_SERVICE: pdf-toolkit-prod-api
  WEB_REPOSITORY: pdf-toolkit-prod-web
  API_REPOSITORY: pdf-toolkit-prod-api

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Unit tests (API)
        run: npm test

      - name: Build (web + API)
        run: npm run build

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform format and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  deploy:
    name: Push images and deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # needed to request the OIDC token for AWS

    steps:
      - uses: actions/checkout@v4

      # Short-lived credentials via OIDC; no AWS keys are stored in GitHub.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            API_INTERNAL_URL=http://api:3000
            NEXT_PUBLIC_API_BASE_URL=/api
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.WEB_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.WEB_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Task definitions point at :latest, so a forced deployment starts new
      # tasks on the image just pushed. ECS rolls tasks one by one behind the
      # ALB and the circuit breaker rolls back if new tasks fail health checks.
      - name: Roll out new tasks
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$API_SERVICE" --force-new-deployment > /dev/null
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$WEB_SERVICE" --force-new-deployment > /dev/null

      - name: Wait for services to become stable
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$API_SERVICE" "$WEB_SERVICE"
